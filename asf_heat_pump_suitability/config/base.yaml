    la_names:
      - "Liverpool"
      - "Plymouth"
      - "Portsmouth"
      - "Southampton"
      - "Swansea"
    grid_squares:
      - "SD"
      - "SJ"
      - "SN"
      - "SS"
      - "SU"
      - "SX"
      - "SZ"
  sampling_areas:
    la_names:
      - "Bath and North East Somerset"
      - "Bradford"
      - "Glasgow City"
      - "Manchester"
      - "Nottingham"
      - "Plymouth"
    grid_squares:
      - "NS"
      - "SD"
      - "SE"
      - "SJ"
      - "SK"
      - "ST"
      - "SX"
  greater_manchester_las:
