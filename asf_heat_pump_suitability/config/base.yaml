data:
  geodata:
    # OpenMap UPRN with coordinates
    uk_osopen_uprn: "s3://asf-local-heat-planning-tool/inputs/geodata/osopenuprn_202510_csv.zip"
    # OpenMap Local Geopackage
    gb_os_openmap_local: "s3://asf-local-heat-planning-tool/inputs/geodata/opmplc_gb.gpkg"
    # OpenMap Local layers for certain grid squares
    grid_square_os_openmap_local: "s3://asf-local-heat-planning-tool/inputs/geodata/v202510_OSOpenMapLocal_geometries_selected/{square}/{square}_{layer}.shp"
    # OpenMap Green space Geopackage
    gb_os_openmap_greenspace: "s3://asf-local-heat-planning-tool/inputs/geodata/opgrsp_gb.gpkg"
    # OpenMap Green space layers for certain grid squares
    grid_square_os_openmap_greenspace: "s3://asf-local-heat-planning-tool/inputs/geodata/v202510_OSOpenMapGreenspace_geometries_selected/{square}/{square}_{layer}.shp"
    # OpenRoad Local road data for GB
    gb_os_openroad: "s3://asf-local-heat-planning-tool/inputs/geodata/oproad_essh_gb/"
    # OpenRoad Local road data for certain grid squares
    grid_square_os_openroad: "s3://asf-local-heat-planning-tool/inputs/geodata/oproad_essh_gb/{square}_RoadLink.shp"
    # UK Points of Interest
    UK_poi_locations: "s3://asf-local-heat-planning-tool/inputs/geodata/poi_uk.gpkg"
    # OpenMap Code Point GB data for postcode lookup
    # TODO: move this file to a different S3 location as it's not just Plymouth data - it's GB data
    gb_code_points: "s3://asf-local-heat-planning-tool/inputs/geodata/codepo_gb.gpkg"
    # GB coastline boundaries
    gb_coast_boundaries: "s3://asf-local-heat-planning-tool/inputs/geodata/boundaries/Countries_December_2024_Boundaries_UK_BFC_6983126662299524946/CTRY_DEC_2024_UK_BFC.shp"
    # Path to folder with UPRN to country mapping files for GB
    gb_uprn_country_mapping: "s3://asf-local-heat-planning-tool/inputs/lookup/NSUL_DEC_2025/"

    boundaries:
      # UK LA boundaries
      UK_ons_lad_bounds: "s3://asf-local-heat-planning-tool/inputs/geodata/boundaries/Local_Authority_Districts_December_2023_Boundaries_UK_BFE_-2600600853110041429/LAD_DEC_2023_UK_BFE.shp"

    heat_network_zones:
      desnz_files: "s3://asf-local-heat-planning-tool/inputs/geodata/heat_network_desnz_data/"
      desnz_polygons: "s3://asf-local-heat-planning-tool/inputs/geodata/heat_network_desnz_data/heat_network_zones_all.parquet"

    gb_spatial_signatures:
      # UrbanGrammarAI Spatial Signatures GB simplified
      simplified: "s3://asf-local-heat-planning-tool/inputs/geodata/v202301_UrbanGrammarAI_SpatialSignatures_GB/spatial_signatures_GB_simplified.gpkg"
      # UrbanGrammarAI Spatial Signatures GB detailed
      full: "s3://asf-local-heat-planning-tool/inputs/geodata/v202301_UrbanGrammarAI_SpatialSignatures_GB/spatial_signatures_GB.gpkg"

    council_tax_data:
      # plymouth council tax data
      plymouth: "s3://asf-local-heat-planning-tool/inputs/geodata/council_tax/PLYMOUTH_CTBANDS_ONSUD_202512.csv"

  # Number of households in each LA recorded in 2021 census
  EW_household_census_data: "s3://asf-local-heat-planning-tool/inputs/testing/v2021_census_households_EW.csv"
  S_household_census_data: "s3://asf-local-heat-planning-tool/inputs/testing/v2022_census_households_S.csv"

  epc:
    domestic: "s3://asf-daps/lakehouse/2025_Q1/processed/epc/deduplicated/processed_dedupl-0.parquet"
    commercial:
      EW: "s3://asf-local-heat-planning-tool/inputs/epc/v092025_EPC_NonDomestic_EW.csv"
      S: "s3://asf-local-heat-planning-tool/inputs/epc/v122025_EPC_NonDomestic_S.csv"

  # Preprocessed data
  processed:
    non_domestic_poi_categories: "s3://asf-local-heat-planning-tool/inputs/processed/non_residential_poi_categories.csv"
    poi_anchor_properties: "s3://asf-local-heat-planning-tool/inputs/processed/poi_anchor_properties_gb.geojson"
    # Names of inspire file bounds for England, Wales and Scotland
    inspire_file_names: "s3://asf-local-heat-planning-tool/inputs/processed/inspire/inspire_file_bounds_EWS.geojson"
    # Manually labelled blocks of flats
    manually_labelled_block_of_flats: "s3://asf-local-heat-planning-tool/inputs/processed/manually_labelled_block_of_flats.parquet"
    # Valid local authority names, taken from the 'LAD23NM' column of the UK_ons_lad_bound file
    valid_la_names: "s3://asf-local-heat-planning-tool/inputs/processed/valid_la_names.csv"

constant:
  id:
    building: "ID"
  threshold:
    m2_per_predicted_UPRN: 261.608136 # Identified by analysis in /research/exploratory/domestic_filtering/domestic_building_identification_threshold_selection.py
    outdoor_space_threshold_m2:
      within_hn_zone: 70
      outside_hn_zone: 30
  sampling_areas:
    la_names:
      - "Bath and North East Somerset"
      - "Bradford"
      - "Glasgow City"
      - "Manchester"
      - "Nottingham"
      - "Plymouth"
    grid_squares:
      - "NS"
      - "SD"
      - "SE"
      - "SJ"
      - "SK"
      - "ST"
      - "SX"
  target_crs: 27700 # British National Grid
  tech_types:
    individual: "Individual solution"
    networked: "Networked heat pump"
    communal: "Communal solution"
    heat_networks: "District heat network"
    individual_or_networked: "Individual or Networked heat pump"
    individual_or_heat_network: "Individual or Heat Network"
  tech_type_codes:
    individual: "IND"
    networked: "NHP"
    communal: "COM"
    heat_networks: "DHNZ"
    individual_or_networked: "IND_or_NHP"
    individual_or_heat_network: "IND_or_DHNZ"
  anchor_radius: 50 # radius in metres around anchor properties within which we are reassigning N-GSHP to communal
  coastline:
    distance_from_coastline_threshold_m: 1500 # distance in metres from coastline threshold
    simplify_tolerance_m: 150 # tolerance in m (metres) used to simplify coastline geometries
  ID:
    building: "ID"
  clustering:
    tolerance_m: 5 # tolerance in m (metres) used to simplify clusters geometries

output:
  dataset:
    # Residential UPRNs and their point geometries
    domestic_uprns: "s3://asf-local-heat-planning-tool/outputs/data/{local_authority}/{local_authority}_domestic_uprns.parquet"
    # Residential UPRNs with all features for modelling, mapping and aggregation
    domestic_uprns_with_features: "s3://asf-local-heat-planning-tool/outputs/data/{local_authority}/{local_authority}_with_features.parquet"
    # Residential UPRNs with their most suitable low carbon heat technology group
    uprns_most_suitable_tech: "s3://asf-local-heat-planning-tool/outputs/data/{local_authorities}/{local_authorities}_uprns_most_suitable_tech.parquet"
    # Residential buildings with their most suitable low carbon heat technology group
    buildings_most_suitable_tech: "s3://asf-local-heat-planning-tool/outputs/data/{local_authorities}/{local_authorities}_buildings_most_suitable_tech.parquet"
    # Buildings containing domestic UPRNs aggregated into groups of neighbouring clusters of the same tech type
    tech_clusters: "s3://asf-local-heat-planning-tool/outputs/data/{local_authorities}/{local_authorities}_clustered_tech_polygons.parquet"
    # Opportunity areas with most suitable tech, cluster ID, contextual data
    clusters_tech_contextual_info: "s3://asf-local-heat-planning-tool/outputs/data/{local_authorities}/{local_authorities}_clusters_contextual_features_{tolerance_m}m.geojson"
  model:
    block_of_flats_model: "s3://asf-local-heat-planning-tool/outputs/models/block_of_flats_building_classifier.pkl"

# Metadata generated for each local authority dataset with the assigned low-carbon heating technology for clusters of proprerties and contextual information about properties within the clusters and surrounding neighbourhood
metadata:
  "License": "This dataset is licensed under a Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License."
  "Development stage": "Alpha - this dataset is in the early stages of development, may contain errors and may change regularly."
  "Data sources and attributions": "https://github.com/nestauk/asf_heat_pump_suitability/tree/dev/asf_heat_pump_suitability/config#readme"
  "GitHub repository": "https://github.com/nestauk/asf_heat_pump_suitability"
  "Variable names and descriptions":
    "cluster_id": "Unique identifier for each cluster."
    "assigned_tech": "Assigned low-carbon heating technology category. Categories are: `Individual solution`, `Networked heat pump`, `Communal solution`, `District heat network`. Can additionally contain `DESNZ_HNZ` values (if the local authority was part of the DESNZ heat network zoning pilot)."
    "geometry": "Polygon geometry of the cluster"
    "n_UPRNs": "Number of domestic UPRNs (properties) within the cluster"
    "n_uprns_in_listed_building": "Number of UPRNs (properties) within the cluster that are in listed buildings"
    "n_uprns_solar_pv": "Number of UPRNs (properties) within the cluster that have solar PV"
    "n_uprns_off_gas": "Number of UPRNs (properties) within the cluster that are off-gas"
    "perc_uprns_solar_pv": "Percentage of UPRNs (properties) within the cluster that have solar PV"
    "perc_uprns_off_gas": "Percentage of UPRNs (properties) within the cluster that are off-gas"
    "attachment_detached": "Number of UPRNs (properties) within the cluster that are detached"
    "attachment_end_terrace": "Number of UPRNs (properties) within the cluster that are end terrace"
    "attachment_flat": "Number of UPRNs (properties) within the cluster that are flats"
    "attachment_mid_terrace": "Number of UPRNs (properties) within the cluster that are mid terrace"
    "attachment_semi_detached": "Number of UPRNs (properties) within the cluster that are semi detached"
    "attachment_null": "Number of UPRNs (properties) within the cluster with unknown attachment type"
    "tenure_owner_occupied": "Number of UPRNs (properties) within the cluster that are owner occupied"
    "tenure_rental_(private)": "Number of UPRNs (properties) within the cluster that are private rental"
    "tenure_rental_(social)": "Number of UPRNs (properties) within the cluster that are social rental"
    "tenure_null": "Number of UPRNs (properties) within the cluster with unknown tenure"
    "perc_tenure_owner_occupied": "Percentage of UPRNs (properties) within the cluster that are owner occupied"
    "perc_tenure_rental_(private)": "Percentage of UPRNs (properties) within the cluster that are private rental"
    "perc_tenure_rental_(social)": "Percentage of UPRNs (properties) within the cluster that are social rental"
    "perc_tenure_null": "Percentage of UPRNs (properties) within the cluster with unknown tenure"
    "current_energy_rating_a": "Number of UPRNs (properties) within the cluster with energy rating A"
    "current_energy_rating_b": "Number of UPRNs (properties) within the cluster with energy rating B"
    "current_energy_rating_c": "Number of UPRNs (properties) within the cluster with energy rating C"
    "current_energy_rating_d": "Number of UPRNs (properties) within the cluster with energy rating D"
    "current_energy_rating_e": "Number of UPRNs (properties) within the cluster with energy rating E"
    "current_energy_rating_f": "Number of UPRNs (properties) within the cluster with energy rating F"
    "current_energy_rating_g": "Number of UPRNs (properties) within the cluster with energy rating G"
    "current_energy_rating_null": "Number of UPRNs (properties) within the cluster with unknown energy rating"
    "median_estimated_energy_consumption_12_months_kwh_per_m2": "Median estimated energy consumption in 12 months (in kWh/m2) of properties within the cluster"
    "median_outdoor_space_m2": "Median of the maximum contiguous outdoor space in metres squared of properties within the cluster"
    "in_hn_zone": "Whether any properties within the cluster are in DESNZ heat network zones. You can refer to https://www.gov.uk/government/publications/heat-network-zone-opportunity-reports to view heat network zone locations"
    "in_city_centre": "Whether any properties within the cluster are in a location classified into one of the following Spatial Signatures Framework pen portraits/signature types https://github.com/nestauk/asf_heat_pump_suitability/blob/f069ae3f6b94db5648da7ccb2c07fbfa3bef4fbc/asf_heat_pump_suitability/pipeline/transform/city_centres.py#L10-L17"
    "within_{COASTLINE_DISTANCE_THRESHOLD_M}m_coastline": "Whether any properties within the cluster are within {COASTLINE_DISTANCE_THRESHOLD_M}m of the coastline"
    "in_protected_area": "Whether any properties within the cluster are in building conservation areas for England and Wales, or Scottish World Heritage sites."
    "within_{ANCHOR_LOAD_RADIUS}m_from_anchor_load": "Whether the cluster is within a {ANCHOR_LOAD_RADIUS}m radius of an anchor load (a location with high heat demand, e.g. a school or hospital). See a full list of anchor load types in https://github.com/nestauk/asf_heat_pump_suitability/blob/f069ae3f6b94db5648da7ccb2c07fbfa3bef4fbc/asf_heat_pump_suitability/pipeline/cluster/cluster.py#L28-L46"

