    poi_anchor_properties: "s3://asf-heat-pump-suitability/local_heat_planning/inputs/processed/poi_anchor_properties_gb.geojson"

constant:
  plymouth:
    la_names: "Plymouth"
    grid_squares: "SX"
  plymouth_similar_cities:
    la_names:
      - "Liverpool"
      - "Plymouth"
      - "Portsmouth"
      - "Southampton"
      - "Swansea"
    grid_squares:
      - "SD"
      - "SJ"
      - "SN"
      - "SS"
      - "SU"
      - "SX"
      - "SZ"
  sampling_areas:
    la_names:
      - "Bath and North East Somerset"
      - "Bradford"
      - "Glasgow City"
      - "Manchester"
      - "Nottingham"
      - "Plymouth"
    grid_squares:
      - "NS"
      - "SD"
      - "SE"
      - "SJ"
      - "SK"
      - "ST"
      - "SX"
  greater_manchester_las:
    la_names:
      - "Bolton"
      - "Bury"
      - "Manchester"
      - "Oldham"
      - "Rochdale"
      - "Salford"
      - "Stockport"
      - "Tameside"
      - "Trafford"
      - "Wigan"
    grid_squares:
      - "SD"
      - "SE"
      - "SJ"
      - "SK"
  cardiff:
    la_names: "Cardiff"
    grid_squares: "ST"
  target_crs: 27700 # British National Grid
  outdoor_space_threshold_m2:
    within_hn_zone: 70
    outside_hn_zone: 30
  tech_types:
    individual: "Individual solution"
    networked: "Networked heat pump"
    communal: "Communal solution"
    heat_networks: "District heat network"
  # radius in metres around anchor properties within which we are reassigning N-GSHP to communal
  anchor_radius: 50
  tech_type_codes:
    individual: "IND"
    networked: "NHP"
    communal: "COM"
    heat_networks: "DHNZ"
  ID:
    building: "ID"

output:
  dataset:
    # Residential UPRNs and their point geometries
    residential_uprns: "s3://asf-heat-pump-suitability/local_heat_planning/outputs/{local_authority}/{local_authority}_residential_uprns.parquet"
    # Residential UPRNs with all features for modelling, mapping and aggregation
    residential_uprns_with_features: "s3://asf-heat-pump-suitability/local_heat_planning/outputs/{local_authority}/{local_authority}_with_features.parquet"
    # Residential UPRNs with their most suitable low carbon heat technology group
    uprns_most_suitable_tech: "s3://asf-heat-pump-suitability/local_heat_planning/outputs/{local_authorities}/{local_authorities}_uprns_most_suitable_tech.parquet"
    # Residential buildings with their most suitable low carbon heat technology group
    buildings_most_suitable_tech: "s3://asf-heat-pump-suitability/local_heat_planning/outputs/{local_authorities}/{local_authorities}_buildings_most_suitable_tech.parquet"
    # Buildings containing domestic UPRNs aggregated into groups of neighbouring clusters of the same tech type
    tech_clusters: "s3://asf-heat-pump-suitability/local_heat_planning/outputs/{local_authorities}/{local_authorities}_clustered_tech_polygons_simplified_{tolerance}m.geojson"
  save_as:
    model:
      block_of_flats_model: "s3://asf-heat-pump-suitability/local_heat_planning/outputs/models/block_of_flats_building_classifier.pkl"

