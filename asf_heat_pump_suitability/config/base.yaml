inputs:
  geodata:
    # OpenMap UPRN with coordinates
    osopen_uprn:                  "s3://asf-local-heat-planning-tool/inputs/geodata/osopenuprn_202510_csv.zip"
    # OpenMap Local Geopackage
    os_openmap_local:             "s3://asf-local-heat-planning-tool/inputs/geodata/opmplc_gb.gpkg"
    # OpenMap Local layers for certain grid squares
    os_openmap_local_grid_square: "s3://asf-local-heat-planning-tool/inputs/geodata/v202510_OSOpenMapLocal_geometries_selected/{square}/{square}_{layer}.shp"
    # UK LA boundaries
    lad_boundaries:               "s3://asf-local-heat-planning-tool/inputs/geodata/boundaries/LAD_DEC_2023_UK_BFE.shp"
    # Points of Interest
    poi:                          "s3://asf-local-heat-planning-tool/inputs/geodata/poi_uk.gpkg"
    # Plymouth Land Registry cadastral parcels
    plymouth_land_registry:       "s3://asf-local-heat-planning-tool/inputs/geodata/Plymouth_Land_Registry_Cadastral_Parcels.gml"

  epc:
    domestic:   "s3://asf-daps/lakehouse/2025_Q1/processed/epc/deduplicated/processed_dedupl-0.parquet"
    commercial: "s3://asf-local-heat-planning-tool/inputs/epc/v092025_EPC_NonDomestic_EW.csv"

  reference:
    non_domestic_poi_categories:        "s3://asf-local-heat-planning-tool/inputs/reference/non_residential_poi_categories.csv"
    manually_labelled_block_of_flats:   "s3://asf-local-heat-planning-tool/inputs/reference/manually_labelled_block_of_flats.parquet"

  inspire:
    scotland_url:       "https://ros.locationcentre.co.uk/inspire/"
    england_wales_url:  "https://use-land-property-data.service.gov.uk/datasets/inspire/download"
    file_bounds_ew:     "s3://asf-local-heat-planning-tool/inputs/inspire/inspire_file_bounds_EW.geojson"

outputs:
  models:
    block_of_flats: "s3://asf-local-heat-planning-tool/outputs/models/block_of_flats_building_classifier.pkl"

constant:
  plymouth:
    la_names: "Plymouth"
    grid_squares: "SX"
