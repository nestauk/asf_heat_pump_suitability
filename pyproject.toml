[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asf_heat_pump_suitability"
version = "0.1.0"
description = "Early-stage scoping of a project to identify which homes/streets are likely to be suitable (or unsuitable) for which types of heat pumps."
readme = "README.md"
authors = [{ name = "Nesta" }]
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "boto3==1.21.21",
    "bs4~=0.0",
    "convertbng~=0.7",
    "fastexcel~=0.13",
    "fiona~=1.1",
    "folium>=0.20.0",
    "geojson~=3.2",
    "geopandas~=1.0",
    "jupytext~=1.17",
    "matplotlib~=3.10.2",
    "metaflow>=2.19.19",
    "numpy<2.0.0",
    "osbng>=0.5.1",
    "pandas~=2.0",
    "pandera~=0.24",
    "polars-lts-cpu==1.5.0",
    "pyarrow>=23.0.0",
    "pygeotile~=1.0",
    "pyogrio~=0.10",
    "pyproj~=3.7",
    "regex~=2024.11",
    "requests>=2.32.4",
    "s3fs==2022.5.0",
    "scikit-learn~=1.7",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "shapely~=2.1",
    "simplekml>=1.3.6",
    "smart-open~=7.3.0",
    "tenacity~=9.1",
    "tqdm~=4.67",
    "xlsx2csv~=0.8",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "flake8>=7.3.0",
    "flake8-bandit>=4.1.1",
    "flake8-black>=0.4.0",
    "flake8-bugbear>=25.11.29",
    "flake8-import-order>=0.19.2",
    "ipykernel>=7.2.0",
    "jupytext>=1.19.1",
    "pre-commit>=4.5.1",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.0.2",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-napoleon>=0.7",
]


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages]
find = { where = ["."], exclude = ["docs"] }

[tool.setuptools.package-data]
"asf_heat_pump_suitability" = ["*.txt", "*.yaml"]
