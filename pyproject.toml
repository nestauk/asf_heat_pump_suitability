[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asf_heat_pump_suitability"
version = "0.1.0"
description = "Early-stage scoping of a project to identify which homes/streets are likely to be suitable (or unsuitable) for which types of heat pumps."
requires-python = ">=3.12"
dependencies = [
    "polars-lts-cpu==1.5.0",
    "fastexcel~=0.13",
    "scikit-learn~=1.7",
    "matplotlib~=3.10.2",
    "tqdm~=4.67",
    "geopandas~=1.0",
    "shapely~=2.1",
    "pyGeoTile~=1.0",
    "pyproj~=3.7",
    "pandas~=2.0",
    "geojson~=3.2",
    "requests>=2.32.4",
    "convertbng~=0.7",
    "pyogrio~=0.10",
    "regex~=2024.11",
    "xlsx2csv~=0.8",
    "s3fs>=2022.5.0",
    "boto3>=1.21.21",
    "tenacity~=9.1",
    "numpy<2.0.0",
    "fiona~=1.1",
    "bs4~=0.0",
    "pandera~=0.24",
    "folium",
    "seaborn",
    "scipy",
    "pyarrow",
    "simplekml",
    "smart-open~=7.3.0",
    "osbng",
    "typer>=0.12",
    "pydantic-settings>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "moto[s3]",
    "ruff",
    "pre-commit",
    "ipykernel",
    "jupytext~=1.17",
]

[tool.hatch.build.targets.wheel]
packages = ["asf_heat_pump_suitability"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "W"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N999",  # invalid module name (existing conventions)
]

[tool.ruff.lint.per-file-ignores]
# Pre-existing function names with acronyms (LA, LSOA) — renaming is a breaking API change
"asf_heat_pump_suitability/getters/get_datasets.py" = ["N802"]
# ML convention: uppercase X, X_train, X_test for feature matrices
"asf_heat_pump_suitability/pipeline/model/block_of_flats/train_model.py" = ["N806"]

[tool.ruff.format]
# ruff format replaces black

[tool.pytest.ini_options]
testpaths = ["tests"]
