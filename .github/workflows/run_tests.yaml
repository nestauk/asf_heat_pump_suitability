name: Run tests
on:
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          uv sync --all-extras
          uv run pytest --cov=asf_heat_pump_suitability
